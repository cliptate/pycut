[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycut"
version = "0.1.0"
description = "A Python library for cutting videos using AI-based speech recognition and natural language processing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx<0.28",
    "mlx-audio>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26",
    "py-googletrans>=4.0.0",
    "pyobjc-framework-naturallanguage>=12.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "qwen-asr>=0.0.6; sys_platform == 'linux' or sys_platform == 'win32'",
    "silero-vad>=6.2.1",
    "soundfile>=0.12.1",
    "torch==2.10.*; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchaudio==2.10.*; sys_platform == 'linux' or sys_platform == 'win32'",
    "voxcpm>=2.0.3; sys_platform == 'linux' or sys_platform == 'win32'",
]

[project.scripts]
pycut = "pycut.cli:console_main"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that require real models or external-sized fixtures",
    "slow: slow tests that are skipped by default unless explicitly selected",
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "setuptools>=68"]
